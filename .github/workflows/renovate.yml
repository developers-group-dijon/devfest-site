name: Renovate

on:
  schedule:
    # Le 1er de chaque mois à 6h UTC (≈ 7h-8h heure de Paris).
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: renovatebot/github-action@v46.1.14
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          # Pour un dry-run ponctuel, définir la variable de repo RENOVATE_DRY_RUN
          # à "full" dans Settings > Secrets and variables > Actions > Variables.
          RENOVATE_DRY_RUN: ${{ vars.RENOVATE_DRY_RUN }}
