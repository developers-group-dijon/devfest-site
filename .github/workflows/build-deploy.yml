name: Build et déploiement OVH

# Même logique que le dépôt developers-group-dijon/site :
#   - build : vérifie le code, construit les variantes prod et test ;
#   - deploy-test : tout push (pas les pull requests) publie en test ;
#   - deploy-production : main et les branches d'archive devfest-dijon-<année>
#     sont publiées en prod, une fois le test publié.
# Le lancement manuel accepte une autre branche que celle du workflow : il sert
# à publier les anciennes archives, qui n'ont pas ce workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche à publier, si différente (ex. devfest-dijon-2024)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Dossiers des environnements sur le SFTP OVH (une édition par sous-dossier <année>/)
  PROD_DIR: devfest
  TEST_DIR: devfest_test

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      year: ${{ steps.target.outputs.year }}
      update_root: ${{ steps.target.outputs.update_root }}
      deploy_prod: ${{ steps.target.outputs.deploy_prod }}
      test_url: ${{ steps.target.outputs.test_url }}
      prod_url: ${{ steps.target.outputs.prod_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Récupère le site
        uses: actions/checkout@v6
        with:
          # Vide hors lancement manuel : ref de l'événement
          ref: ${{ inputs.ref }}
          path: site
      # Les scripts de déploiement viennent toujours du commit du workflow,
      # y compris quand on publie une ancienne branche qui ne les a pas.
      - name: Récupère les scripts de déploiement
        uses: actions/checkout@v6
        with:
          path: tools
          sparse-checkout: _scripts
      - name: Use Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - name: Détermine l'édition à publier
        id: target
        working-directory: .
        env:
          BRANCH: ${{ inputs.ref || github.head_ref || github.ref_name }}
          RAW_EVENT_PATH: site/_data/rawEvent.js
        run: node tools/_scripts/ovh/target.js | tee -a "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Validate code
        # --if-present : les plus anciennes archives n'ont pas de script `check`
        run: npm run check --if-present
      - name: Build test
        env:
          SITE_URL: ${{ steps.target.outputs.test_url }}
        run: |
          if [ -f _data/site.json ]; then
            jq --arg url "$SITE_URL" '.url = $url' _data/site.json > site.json.tmp
            mv site.json.tmp _data/site.json
          fi
          npm run clean-build
          # Hors du dossier du site : Eleventy retraiterait ce HTML au build suivant
          mv _site "$RUNNER_TEMP/public-test"
          git checkout -- _data/site.json 2>/dev/null || true
      - name: Build production
        run: |
          npm run clean-build
          cp -r _site "$RUNNER_TEMP/public"
      - name: Audit perf + a11y
        id: audit
        if: github.event_name == 'pull_request' || steps.target.outputs.deploy_prod != 'true'
        env:
          LHCI_NUMBER_OF_RUNS: "3"
        run: npm run audit
      - name: Upload Lighthouse reports
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: site/.lighthouseci/
          retention-days: 7
          include-hidden-files: true
      - name: Upload public dir
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: ${{ runner.temp }}/public
          retention-days: 7
      - name: Upload public-test dir
        uses: actions/upload-artifact@v7
        with:
          name: public-test
          path: ${{ runner.temp }}/public-test
          retention-days: 7

  deploy-test:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ needs.build.outputs.test_url }}
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Récupère les scripts de déploiement
        uses: actions/checkout@v6
        with:
          sparse-checkout: _scripts
      - name: Use Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"
      - name: Download public-test dir
        uses: actions/download-artifact@v8
        with:
          name: public-test
          path: public-test
      - name: Install lftp and htpasswd
        run: sudo apt-get update && sudo apt-get install -y lftp apache2-utils
      - name: Protect with password
        env:
          AUTH_USER: ${{ secrets.TEST_AUTH_USER }}
          AUTH_PASSWORD: ${{ secrets.TEST_AUTH_PASSWORD }}
          HTPASSWD_PATH: ${{ secrets.TEST_HTPASSWD_PATH }}
          UPDATE_ROOT: ${{ needs.build.outputs.update_root }}
          YEAR: ${{ needs.build.outputs.year }}
        run: |
          for v in AUTH_USER AUTH_PASSWORD HTPASSWD_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::$v est vide : secret ou variable absent de l'environnement GitHub « test » ou du dépôt"
              exit 1
            fi
          done
          printf '%s\n' "$AUTH_PASSWORD" | htpasswd -niB -C 12 "$AUTH_USER" > "$RUNNER_TEMP/.htpasswd"
          echo "HTPASSWD=$RUNNER_TEMP/.htpasswd" >> "$GITHUB_ENV"
          if [ "$UPDATE_ROOT" = true ]; then
            node _scripts/ovh/htaccess.js test "$YEAR" > "$RUNNER_TEMP/root.htaccess"
            echo "ROOT_HTACCESS=$RUNNER_TEMP/root.htaccess" >> "$GITHUB_ENV"
          fi
      - name: Upload sftp
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENV_NAME: test
          REMOTE_DIR: ${{ env.TEST_DIR }}
          YEAR: ${{ needs.build.outputs.year }}
          SITE_DIR: public-test
        run: _scripts/ovh/deploy.sh

  deploy-production:
    needs: [build, deploy-test]
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy_prod == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.build.outputs.prod_url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Récupère les scripts de déploiement
        uses: actions/checkout@v6
        with:
          sparse-checkout: _scripts
      - name: Use Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"
      - name: Download public dir
        uses: actions/download-artifact@v8
        with:
          name: public
          path: public
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Génère le .htaccess racine
        if: needs.build.outputs.update_root == 'true'
        env:
          YEAR: ${{ needs.build.outputs.year }}
        run: |
          node _scripts/ovh/htaccess.js prod "$YEAR" > "$RUNNER_TEMP/root.htaccess"
          echo "ROOT_HTACCESS=$RUNNER_TEMP/root.htaccess" >> "$GITHUB_ENV"
      - name: Upload sftp
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENV_NAME: production
          REMOTE_DIR: ${{ env.PROD_DIR }}
          YEAR: ${{ needs.build.outputs.year }}
          SITE_DIR: public
        run: _scripts/ovh/deploy.sh
